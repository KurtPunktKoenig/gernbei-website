<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funktionen entdecken in Gernbei</title>
<link rel="stylesheet" href="schriften.css">
<style>
:root{--bg:#FAFAF8;--karte:#FFFFFF;--leiste:#F5F5F3;--text:#111214;--mid:#3A3B40;--muted:#6E6E73;--linie:#D9D9D5;--akzent:#C2410C;--akzent-hell:#FDEEE4;--tinte:#111214;--rot:#B3261E;
--c-nach:#4C7A5A;--c-texte:#2E6B73;--c-suchen:#3D6FA8;--c-notizen:#8A6116;--c-pruefen:#6B4E9B;--c-kunden:#B4472E;--c-einrichten:#5E5F64}
:root[data-akzent="tinte"]{--akzent:#111214;--akzent-hell:#EDEDEA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--akzent);outline-offset:2px;border-radius:6px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.versteckt{display:none!important}

/* Entwurfsleiste, gehoert nicht zum Produkt */
.entwurf{background:#111214;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px;font-size:14px}
.entwurf b{font-weight:600}
.entwurf .frei{flex:1}
.schalter{display:inline-flex;border:1px solid #55565c;border-radius:8px;overflow:hidden}
.schalter button{background:none;border:0;color:#cfd0d4;padding:5px 12px;font-size:14px}
.schalter button[aria-pressed="true"]{background:#fff;color:#111214;font-weight:600}

.app{flex:1;display:flex;min-height:0}
nav{width:270px;flex:none;background:var(--leiste);border-right:1px solid var(--linie);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.logo .zeichen{width:34px;height:34px;color:var(--akzent)}
.logo b{font-size:22px;line-height:1;letter-spacing:-.02em}
.logo b i{font-style:normal;color:var(--akzent)}
.logo small{display:block;font-size:13px;color:var(--mid)}
.logo .zu{margin-left:auto;background:none;border:0;color:var(--muted);padding:6px;border-radius:6px}
.neu{display:flex;align-items:center;gap:10px;width:calc(100% - 3px);background:var(--karte);color:var(--text);border:1px solid var(--text);border-radius:10px;box-shadow:2px 2px 0 #D23A26;padding:11px 14px;font-weight:600}
.etikett{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:18px 8px 6px;display:flex;justify-content:space-between}
.etikett button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.punkt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:8px;border-radius:8px;color:var(--text)}
.punkt:hover{background:#EBEBE8}
.punkt.an{background:var(--akzent-hell);font-weight:600}
.punkt small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.punkt .pf{width:10px;height:10px;border-radius:50%;margin:0 5px}
.luft{flex:1;min-height:12px}
.person{border-top:1px solid var(--linie);margin-top:8px;padding-top:10px}
.person .bild{width:32px;height:32px;border-radius:50%;background:var(--tinte);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}

main{flex:1;min-width:0;overflow-y:auto}
.innen{max-width:1000px;margin:0 auto;padding:28px 32px 56px}
.oben-mobil{display:none}
.vorzeile{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--akzent);font-weight:700;margin:0 0 6px}
h1{font-size:34px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:22px;letter-spacing:-.01em;margin:0}
.unter{color:var(--mid);font-size:17px;margin:0 0 20px}

.suche{display:flex;gap:10px;margin-bottom:18px}
.suchfeld{flex:1;display:flex;align-items:center;gap:10px;background:var(--karte);border:1.5px solid #B9B9B4;border-radius:10px;padding:0 14px;color:var(--muted)}
.suchfeld:focus-within{border-color:var(--akzent)}
.suchfeld input{flex:1;border:0;outline:0;background:none;padding:13px 0;min-width:0;color:var(--text)}
.suchfeld .leeren{background:none;border:0;color:var(--muted);padding:6px;font-size:18px;line-height:1}
.haupt{background:var(--akzent);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700}
.haupt[disabled]{opacity:.6;cursor:default}
.dunkel{background:var(--tinte);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.neben{background:var(--karte);color:var(--text);border:1.5px solid #B9B9B4;border-radius:8px;padding:8px 14px;font-weight:600}
.neben[disabled]{color:var(--muted);border-style:dashed;cursor:default}
.link{background:none;border:0;padding:0;color:var(--text);text-decoration:underline;text-underline-offset:3px}

.filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--karte);border:1.5px solid #B9B9B4;border-radius:999px;padding:7px 16px;display:inline-flex;align-items:center;gap:8px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--f)}
.chip[aria-pressed="true"]{background:var(--tinte);border-color:var(--tinte);color:#fff;font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓";font-size:13px}
.einr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;color:var(--mid);font-size:15px;padding-bottom:18px;border-bottom:1px solid var(--linie);margin-bottom:22px}
.einr span{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.hinweis{background:var(--akzent-hell);border-radius:8px;padding:9px 14px;margin:0 0 18px;font-size:15px}

.gruppe{margin-bottom:30px}
.gkopf{display:flex;align-items:center;gap:10px}
.gkopf i{width:14px;height:14px;border-radius:50%;background:var(--f)}
.gtext{color:var(--mid);margin:2px 0 12px}
.karten{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:16px 18px;display:flex;gap:14px}
.kachel{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--f) 13%,#fff);color:var(--f);display:grid;place-items:center;flex:none}
.karte h3{margin:0 0 2px;font-size:18px;letter-spacing:-.01em}
.karte p{margin:0 0 12px;color:var(--mid)}
.kinhalt{display:flex;flex-direction:column;flex:1;min-width:0}
.kinhalt .fuss{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.marke{font-size:13px;color:var(--mid);border:1px solid var(--linie);border-radius:999px;padding:2px 10px}
.marke.auf{border-color:var(--akzent);color:var(--akzent);font-weight:600}
.treffer-bereich{font-size:13px;color:var(--f);font-weight:600;margin-bottom:2px}
.frage{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:14px 18px;margin-top:8px}

/* Assistent */
.pfad{font-size:15px;color:var(--mid);margin-bottom:6px}
.pfad button{color:var(--akzent);font-weight:600;text-decoration:none}
.stufen{display:flex;align-items:center;gap:10px;list-style:none;padding:0;margin:18px 0 20px;flex-wrap:wrap}
.stufen li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.stufen li b{width:28px;height:28px;border-radius:50%;border:1.5px solid #B9B9B4;display:grid;place-items:center;font-size:14px;background:var(--karte)}
.stufen li[aria-current]{color:var(--text);font-weight:700}
.stufen li[aria-current] b{background:var(--akzent);border-color:var(--akzent);color:#fff}
.stufen li[aria-current] span{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.stufen li.fertig{color:var(--text)}
.stufen li.fertig b{background:var(--tinte);border-color:var(--tinte);color:#fff}
.stufen .strich{flex:1;min-width:20px;max-width:110px;height:1px;background:#B9B9B4}
.zwei{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.blatt{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:20px 22px}
.feld{margin-bottom:16px}
.feld label,.feld legend{display:block;font-weight:600;margin-bottom:5px;padding:0}
.feld fieldset{border:0;padding:0;margin:0}
.feld input[type=text],.feld textarea,.feld select{width:100%;background:#fff;border:1.5px solid #B9B9B4;border-radius:8px;padding:10px 12px}
.feld textarea{min-height:92px;resize:vertical}
.feld .hilfe{font-size:14px;color:var(--muted);margin-top:4px}
.feld .fehler{font-size:14px;color:var(--rot);font-weight:600;margin-top:4px}
.feld.falsch input,.feld.falsch textarea{border-color:var(--rot)}
.wahl{display:flex;flex-wrap:wrap;gap:8px}
.wahl label{font-weight:400;margin:0;border:1.5px solid #B9B9B4;border-radius:8px;padding:7px 14px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;background:#fff}
.wahl input{position:absolute;opacity:0}
.wahl label:has(input:checked){border-color:var(--tinte);font-weight:600;box-shadow:inset 0 0 0 1px var(--tinte)}
.wahl label:has(input:checked)::before{content:"✓"}
.wahl label:has(input:focus-visible){outline:3px solid var(--akzent);outline-offset:2px}
.herkunft{font-size:14px;color:var(--c-texte);margin-top:4px}
.seite{background:var(--akzent-hell);border-radius:12px;padding:18px 20px}
.seite h2{font-size:19px;margin-bottom:4px}
.seite ul{margin:10px 0 0;padding-left:20px}
.seite li{margin-bottom:4px}
.fuss-hinweis{display:flex;gap:8px;align-items:center;color:var(--mid);font-size:14px;margin-top:14px}
.reihe{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wartet{display:flex;align-items:center;gap:12px;padding:30px 4px;font-weight:600}
.kreis{width:22px;height:22px;border:3px solid var(--linie);border-top-color:var(--akzent);border-radius:50%;animation:dreh 1s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.kreis{animation:none}}
.platzhalter{border:1.5px dashed #B9B9B4;border-radius:8px;padding:10px 12px;font-size:14px;color:var(--mid);margin-bottom:14px}
.ok{background:#EAF3EC;border-radius:8px;padding:10px 14px;margin-top:14px}
details{margin-top:16px;font-size:14px;color:var(--mid)}
details pre{white-space:pre-wrap;background:var(--leiste);padding:10px 12px;border-radius:8px;font:13px/1.5 ui-monospace,Consolas,monospace;color:var(--text)}
.vorschau{white-space:pre-wrap;background:var(--leiste);border-radius:8px;padding:14px 16px;margin:0 0 16px}

/* Erklaerseite */
.erkl h2{margin:30px 0 8px}
.erkl h2:first-of-type{margin-top:8px}
.erkl table{border-collapse:collapse;width:100%;background:var(--karte);font-size:15px}
.erkl th,.erkl td{border:1px solid var(--linie);padding:7px 10px;text-align:left;vertical-align:top}
.erkl th{background:var(--leiste)}
.erkl .tw{overflow-x:auto}
.erkl li{margin-bottom:6px}
.kasten{background:var(--karte);border:1px solid var(--linie);border-left:4px solid var(--akzent);border-radius:8px;padding:12px 16px;margin:12px 0}

@media (max-width:860px){
  nav{display:none;position:fixed;inset:0 auto 0 0;z-index:5;box-shadow:0 0 40px rgba(0,0,0,.3)}
  nav.offen{display:flex}
  .oben-mobil{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--linie);background:var(--leiste);position:sticky;top:0;z-index:2}
  .oben-mobil button{background:none;border:0;padding:6px}
  .innen{padding:20px 16px 48px}
  h1{font-size:27px}
  .karten,.zwei{grid-template-columns:1fr}
  .suche{flex-wrap:wrap}.suche .haupt{width:100%}
  .stufen .strich{min-width:10px}
}
.kontext{font-size:14px;color:var(--mid);border-bottom:1px solid var(--linie);padding-bottom:10px;margin-bottom:18px}
.verlauf{display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto}
.ich{align-self:flex-end;background:var(--tinte);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:85%}
.sie p{margin:0 0 8px}
.ekasten{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:16px 18px}
.ekasten.alt{background:var(--leiste)}
.ekasten.alt .vorschau{background:none;padding:0;margin:6px 0 0}
.ekopf{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.ekasten .stufen{margin:8px 0 14px}
.etrenn{border-top:1px solid var(--linie);margin:16px 0 12px}
.klein{font-size:14px;color:var(--muted)}
.zeile-unten{max-width:760px;margin:22px auto 0;display:flex;align-items:center;gap:10px;border:1.5px solid #B9B9B4;border-radius:14px;background:#fff;padding:12px 14px;color:var(--muted)}
.zeile-unten span{flex:1}
.zeile-unten span.voll{color:var(--text)}
.zeile-unten b{width:32px;height:32px;border-radius:50%;background:var(--tinte);color:#fff;display:grid;place-items:center;flex:none}
.akarte{max-width:760px;margin:90px auto 0;border:1px solid var(--linie);border-bottom:0;border-radius:12px 12px 0 0;background:var(--leiste);padding:12px 16px;font-size:15px}
.akarte p{margin:4px 0 0;color:var(--mid)}
.akarte .z1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.akarte .z1 span{color:var(--muted)}
.akarte+.zeile-unten{margin-top:0;border-radius:0 0 14px 14px}
/* Fassung 3: Auswahl oben, Blatt unten; Orange dezent; Leiste kuerzer */
nav{padding:12px 10px}
.logo{padding:2px 8px 10px}
.neu{padding:9px 14px}
.etikett{padding:12px 8px 3px}
.punkt{padding:6px 8px}
@media (max-height:760px){nav{font-size:15px;padding:8px 10px}.logo{padding-bottom:6px}.logo .zeichen{width:28px;height:28px}.logo b{font-size:20px}.neu{padding:7px 14px}.punkt small{display:none}.etikett{padding:7px 8px 2px}.punkt{padding:3px 8px}.luft{min-height:4px}.person{margin-top:2px;padding-top:4px}.person .bild{width:28px;height:28px}}
.abschnitt{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:18px 0 6px}
.abschnitt span{text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
.auswahl{display:flex;flex-wrap:wrap;gap:12px 28px;background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:14px 18px}
.auswahl .feld{margin:0}
.auswahl .wahl label{padding:6px 12px}
.bogen{background:#fff;border:1px solid var(--linie);border-radius:6px;box-shadow:0 2px 14px rgba(17,18,20,.08);padding:24px 28px;max-width:720px;margin:0 auto}
.bogen.im{box-shadow:none;max-width:none;padding:14px 18px}
.bogen .zl{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--linie)}
.bogen .zl>b{width:64px;color:var(--muted);font-weight:600;flex:none}
.bogen input[type=text],.bogen textarea{width:100%;border:1.5px solid #B9B9B4;border-radius:8px;padding:9px 12px;background:#fff}
.bogen textarea{min-height:112px;resize:vertical;display:block}
.bogen.im textarea{min-height:230px;margin-top:14px}
.eintrag{flex:1;min-width:0}
.eintrag label{font-weight:600;display:block;margin-bottom:4px}
.eintrag .hilfe{font-size:14px;color:var(--muted);margin-top:4px}
.eintrag .fehler{font-size:14px;color:var(--rot);font-weight:600;margin-top:4px}
.eintrag.falsch input,.eintrag.falsch textarea{border-color:var(--rot)}
.grau{color:#6E6E73;background:#F1F1EE;border-radius:6px;padding:2px 9px;display:inline-block}
.gernbei{color:#6E6E73;margin:14px 0}
.gernbei .dein{color:var(--text);font-weight:600}
.briefkopf{text-align:right;margin-bottom:22px}
.anschrift{max-width:330px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-bottom:14px}
.anschrift .eintrag{width:100%}
.datum{text-align:right;margin-bottom:14px}
.unterbogen{max-width:720px;margin:16px auto 0}
@media (max-width:860px){.bogen{padding:16px 14px}}
.mikro{display:inline-flex;align-items:center;gap:8px;background:var(--tinte);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.mikro.klein-m{padding:7px 12px;background:var(--karte);color:var(--text);border:1.5px solid #B9B9B4}
.mikro.hoert{background:var(--rot);color:#fff;border-color:var(--rot)}
.mikro.hoert svg{animation:puls 1s ease-in-out infinite}
@keyframes puls{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.mikro.hoert svg{animation:none}}
.diktatzeile{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px}
.diktatzeile .st{font-size:14px;color:var(--mid)}
.leise-wahl{font-size:14px;color:var(--muted);margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400}
.ansage{background:var(--karte);border:2px solid var(--tinte);border-radius:18px 18px 18px 4px;padding:16px 18px}
.ansage:focus-within{border-color:var(--akzent)}
.ansage.falsch{border-color:var(--rot)}
.ansage label{font-weight:700;font-size:19px;display:block;margin-bottom:8px}
.ansage textarea{width:100%;min-height:92px;border:0;outline:0;resize:vertical;background:none;font-size:17px;padding:0;display:block}
.ansage .hilfe{font-size:14px;color:var(--muted);margin-top:8px}
.ansage .fehler{font-size:14px;color:var(--rot);font-weight:600;margin-top:6px}
.pfeil{text-align:center;font-weight:700;color:var(--akzent);margin:20px 0 10px}
.pfeil small{display:block;font-weight:400;color:var(--muted)}
.bogen.bsp{color:var(--muted)}
.marke-bsp{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border:1px solid var(--linie);border-radius:999px;padding:1px 10px;margin-bottom:8px}
.bsp-aus{font-size:14px;margin-bottom:12px}
.vorschau-text{white-space:pre-wrap;margin:14px 0 0}
.grau.block{display:block;padding:14px 12px;margin:10px 0}
.erledigt{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px auto 0;max-width:720px;font-size:14px;color:var(--mid)}
.erledigt span{border:1px solid var(--linie);border-radius:999px;padding:2px 10px;background:var(--karte)}
/* Stand 103: Ueberschriften wie auf gernbei.de, duenn, rot, in Grossbuchstaben; Funktionen entdecken in der Form des Website-Knopfs, leise */
.etikett,.vorzeile,.gkopf h2{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:#D23A26}
.etikett button{font-family:Inter,system-ui,sans-serif}
.gkopf h2{font-size:12px;margin:0}
.gtext{color:var(--text);font-size:22px;font-weight:600;letter-spacing:-.01em;margin:2px 0 12px}
#nav-funk{background:var(--karte);border:1px solid var(--text);border-radius:10px;box-shadow:2px 2px 0 #D23A26;font-weight:600;width:calc(100% - 3px)}
.bkacheln{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:6px}
.bkachel{background:var(--karte);border:1px solid var(--linie);border-radius:16px;padding:16px 16px 12px;display:flex;flex-direction:column;min-width:0}
.bkachel .gtext{font-size:17px;line-height:1.3;margin:2px 0 8px}
.bzeile{display:flex;align-items:center;gap:9px;width:calc(100% + 12px);margin:0 -6px;padding:6px;border:0;background:none;border-radius:9px;font:inherit;font-size:15px;color:var(--text);text-align:left;cursor:pointer;min-height:42px}
.bzeile:hover{background:var(--leiste)}.bzeile .kachel{width:26px;height:26px;border-radius:7px;flex:none}.bzeile .kachel svg{width:15px;height:15px}.bzeile .bt{flex:1;min-width:0}
.bzeile em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.bmehr{margin-top:auto;padding-top:8px;align-self:flex-start}
@media (max-width:1100px){.bkacheln{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:600px){.bkacheln{grid-template-columns:1fr}}

.entwurf .schalter{margin-left:auto;display:flex;gap:4px;align-items:center;font-size:13px}

/* Diktieren wie an der Schreibzeile: ein Tipp, sprechen, der Text steht im Feld. Ohne Mikrofon spielt die Ansicht ein Beispiel ein. */
var Erk=null,dRec=null,dSim=null,dKnopf=null;
var DIKTAT_BEISPIEL={"f-ewas":"soll ich ab januar nur noch fassaden machen und die innenarbeiten abgeben, der jonas würde dann gehen, entscheiden muss ich bis weihnachten","f-was":BEISPIEL.was,"r-wunsch":"schreib noch dazu dass wir das material mitbringen"};
function diktatEnde(){
  var k=dKnopf;dKnopf=null;if(dSim){clearInterval(dSim);dSim=null}if(!k||!document.body.contains(k))return;
  k.classList.remove("hoert");k.setAttribute("aria-pressed","false");k.querySelector("span").textContent="Diktieren";
  var st=$("#st-"+k.dataset.mikro);if(st&&st.dataset.art!=="bleibt")st.textContent="";
}
function diktieren(k){
  if(dKnopf){if(dRec){try{dRec.stop()}catch(x){}}diktatEnde();return}
  var ziel=$("#"+k.dataset.mikro),st=$("#st-"+k.dataset.mikro),vorher=ziel.value?ziel.value.replace(/\s*$/," "):"";
  function setzen(t){ziel.value=vorher+t;ziel.dispatchEvent(new Event("input",{bubbles:true}))}
  function spielen(){
    var w=DIKTAT_BEISPIEL[k.dataset.mikro].split(" "),i=0;st.dataset.art="bleibt";st.textContent="In der Vorführung wird ein Beispiel eingesprochen.";
    dSim=setInterval(function(){if(i>=w.length){diktatEnde();return}setzen(w.slice(0,++i).join(" "))},130);
  }
  dKnopf=k;k.classList.add("hoert");k.setAttribute("aria-pressed","true");k.querySelector("span").textContent="Fertig";
  st.dataset.art="";st.textContent="Ich höre zu. Zum Beenden auf Fertig tippen.";
  if(!Erk)return spielen();
  dRec=new Erk();dRec.lang="de-DE";dRec.continuous=true;dRec.interimResults=true;
  dRec.onresult=function(ev){var t="";for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;setzen(t)};
  dRec.onend=function(){if(!dSim)diktatEnde()};
  dRec.onerror=function(){dRec.onend=null;spielen()};
  try{dRec.start()}catch(x){spielen()}
}
function pruefen(a){
  var e=Z.ein[a.id],el=$('[data-feld="was"]'),m=$(".fehler",el),t="";
  if(!String(e.was||"").trim())t="Sagen oder schreiben Sie, worum es geht.";
  else if(!empf(e))t="Sagen Sie noch, an wen es geht, zum Beispiel „an Frau Schneider“ oder eine E-Mail-Adresse.";
  el.classList.toggle("falsch",!!t);m.classList.toggle("versteckt",!t);m.textContent=t;
  if(t)$("#f-was").focus();
  return !t;
}

}

function eFrist(t){
  var re=/(?:^|[\s,.;:])bis\s+((?:(?:zum|zur|ende|anfang|mitte|nächste[nrs]?|kommende[nrs]?)\s+)?[a-zäöüß0-9.]+(?:\s+[0-9]{4})?)/gi,m,f="";

  if(!f)return "";
  return f.replace(/[,;:]+$/,"").replace(/([^0-9])\.+$/,"$1").split(/\s+/).map(function(w,i,a){return (i===a.length-1||/^(ende|anfang|mitte)$/i.test(w))&&/^[a-zäöü]/.test(w)?w.charAt(0).toUpperCase()+w.slice(1):w}).join(" ");
